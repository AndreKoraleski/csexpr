[package]
name = "csexpr"
description = "S-expressions as specified by RFC 9804"
keywords = ["sexp", "s-expression", "rfc9804", "csexp", "spki"]
categories = ["encoding", "parser-implementations", "data-structures"]
documentation = "https://docs.rs/csexpr"
readme = "README.md"
exclude = [".cargo", ".github", "bindings", "fuzz"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

# Nothing here reaches whoever depends on this crate. A benchmark harness is
# the only thing the library itself is built alongside.
[dev-dependencies]
divan = "0.1"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

# The library itself has no dependencies. The bindings that carry it to other
# languages do, and each is a member of its own, built only when asked for.
[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "3"

# What a release has to agree on lives here, so that raising a version is one
# line rather than one line for every package that carries it.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AndreKoraleski/csexpr"
