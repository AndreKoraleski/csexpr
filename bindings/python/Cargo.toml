[package]
name = "csexpr-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Python bindings for csexpr"
license = "MIT"
repository = "https://github.com/AndreKoraleski/csexpr"
publish = false

[lib]
name = "_csexpr"
crate-type = ["cdylib"]

[dependencies]
csexpr = { path = "../.." }

# abi3 builds one wheel per platform that every Python from 3.10 up can load,
# rather than one wheel per platform and version.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
