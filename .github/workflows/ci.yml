name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A release calls this, so that what gets published is what passed here
  # rather than something that merely resembles it.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# One run per branch. A push replaces whatever the branch had running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets
      - name: Test the examples in the documentation
        run: cargo test --doc

  lint:
    name: Lints and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml sets options that only nightly rustfmt reads, among them
      # the width and wrapping of comments, so formatting is checked there.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  msrv:
    name: Build with the oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version the manifest supports
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets

  package:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the package that would be published
        run: cargo package

  python:
    name: Python bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Upgrade pip, since the tools are installed by dependency group
        run: python -m pip install --upgrade pip
      - name: Build the extension and install it, with the tools
        run: pip install --editable . --group dev
      - name: Test
        run: pytest

  python-lint:
    name: Python formatting, lints and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Upgrade pip, since the tools are installed by dependency group
        run: python -m pip install --upgrade pip
      # The extension has to be built for the types to be checked against it,
      # and pytest has to be there for the tests that import it to be read as
      # anything but Any.
      - name: Build the extension and install it, with the tools
        run: pip install --editable . --group dev
      - name: Check formatting
        run: ruff format --check .
      - name: Lints
        run: ruff check .
      - name: Types
        run: mypy .
