name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag and the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag against the manifest
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"

          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not name version $version" >&2
            exit 1
          fi

      - name: Check that the bindings carry the same version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bound=$(grep -m1 '^version = ' bindings/python/Cargo.toml | cut -d'"' -f2)

          if [ "$version" != "$bound" ]; then
            echo "the Python bindings say $bound and the library says $version" >&2
            exit 1
          fi

      - name: Check that the changelog mentions the version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --all-targets

      - name: Test the examples in the documentation
        run: cargo test --doc

  crate:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing hands out a short-lived token against this, so no
      # crates.io token is ever stored in the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # One wheel per platform covers every Python from 3.10 up, since the
      # extension is built against the stable ABI.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist

  sdist:
    name: Build the source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing again, so no PyPI token is stored either.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: Draft the release notes
    needs: [crate, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
