name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing hands out a short-lived token against this, so no
      # crates.io token is ever stored in the repository.
      id-token: write
      # The last step creates the GitHub release for the tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag against the manifest
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"

          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not name version $version" >&2
            exit 1
          fi

      - name: Check that the changelog mentions the version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --all-targets

      - name: Test the examples in the documentation
        run: cargo test --doc

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Draft the release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
