name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that guards a push to master, run again against the tag. A
  # release is published only if the whole of it passes, so a red master
  # cannot become a green release.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Every package takes its version from [workspace.package], so there is
      # one version to read and one to agree with.
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "csexpr") | .version')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the manifest says $version"

      - name: Check the tag against the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"

          if [ "${{ steps.version.outputs.version }}" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not name the version in the manifest" >&2
            exit 1
          fi

      - name: Check that the changelog mentions the version
        run: |
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for this version" >&2
            exit 1
          fi

  crate:
    name: Publish to crates.io
    needs: [check, ci]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Trusted Publishing hands out a short-lived token against this, so no
      # crates.io token is ever stored in the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A release that got this far once and failed later can be run again
      # without tripping over what it already did.
      - name: See whether this version is already published
        id: published
        run: |
          version="${{ needs.check.outputs.version }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "csexpr release workflow (github.com/AndreKoraleski/csexpr)" \
            "https://crates.io/api/v1/crates/csexpr/$version")

          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "crates.io already has $version"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.published.outputs.already == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [check, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # One wheel per platform covers every Python from 3.10 up, since the
      # extension is built against the stable ABI.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist

  sdist:
    name: Build the source distribution
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing again, so no PyPI token is stored either.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # As above, so that a run after a partial failure finishes the job
          # rather than refusing what is already there.
          skip-existing: true

  release:
    name: Draft the release notes
    needs: [crate, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
